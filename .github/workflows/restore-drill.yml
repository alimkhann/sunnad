name: Restore Drill

on:
  schedule:
    - cron: "30 4 * * 0"
  workflow_dispatch:
    inputs:
      environment:
        description: "Backup environment to restore (dev/prod)"
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod
      source_run_id:
        description: "Optional backup-nightly workflow run ID"
        required: false
        type: string
      artifact_name:
        description: "Optional backup artifact name (db-backup-<env>-<id>)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq unzip

      - name: Resolve backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
          INPUT_ARTIFACT_NAME: ${{ github.event.inputs.artifact_name }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_ENVIRONMENT:-}" ]]; then
            backup_env="$INPUT_ENVIRONMENT"
          else
            backup_env="prod"
          fi

          if [[ -n "${INPUT_SOURCE_RUN_ID:-}" ]]; then
            run_id="$INPUT_SOURCE_RUN_ID"
          else
            run_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/backup-nightly.yml/runs?branch=main&status=success&per_page=30" \
                --jq '.workflow_runs | map(select(.conclusion == "success")) | .[0].id // empty'
            )"
          fi

          test -n "$run_id" || (echo "Could not resolve a successful backup-nightly workflow run." && exit 1)

          if [[ -n "${INPUT_ARTIFACT_NAME:-}" ]]; then
            artifact_name="$INPUT_ARTIFACT_NAME"
          else
            prefix="db-backup-${backup_env}-"
            artifact_name="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
                --jq --arg prefix "$prefix" '.artifacts | map(select(.expired == false and (.name | startswith($prefix)))) | sort_by(.created_at) | reverse | .[0].name // empty'
            )"
          fi

          test -n "$artifact_name" || (echo "No backup artifact found for environment: ${backup_env}" && exit 1)

          artifact_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq --arg artifact_name "$artifact_name" '.artifacts[] | select(.name == $artifact_name and .expired == false) | .id' \
              | head -n 1
          )"
          test -n "$artifact_id" || (echo "Could not resolve artifact ID for ${artifact_name}" && exit 1)

          echo "BACKUP_ENV=${backup_env}" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=${run_id}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${artifact_name}" >> "$GITHUB_ENV"
          echo "ARTIFACT_ID=${artifact_id}" >> "$GITHUB_ENV"

      - name: Download backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ env.ARTIFACT_ID }}
        run: |
          set -euo pipefail
          mkdir -p backups/restore-drill
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > backups/restore-drill/backup.zip
          unzip -qo backups/restore-drill/backup.zip -d backups/restore-drill
          rm -f backups/restore-drill/backup.zip

          manifest_path="$(find backups/restore-drill -name manifest.json | head -n 1)"
          test -n "$manifest_path" || (echo "Manifest not found in downloaded artifact" && exit 1)
          echo "MANIFEST_PATH=${manifest_path}" >> "$GITHUB_ENV"

      - name: Restore + verify
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          RESTORE_DEV_DB_URL: ${{ secrets.SUPABASE_RESTORE_DEV_DB_URL }}
          RESTORE_PROD_DB_URL: ${{ secrets.SUPABASE_RESTORE_PROD_DB_URL }}
          MANIFEST_PATH: ${{ env.MANIFEST_PATH }}
        run: |
          set -euo pipefail
          if [[ "${BACKUP_ENV}" == "dev" ]]; then
            TARGET_DB_URL="${RESTORE_DEV_DB_URL:-}"
          else
            TARGET_DB_URL="${RESTORE_PROD_DB_URL:-}"
          fi
          test -n "$TARGET_DB_URL" || (echo "Missing restore target DB URL secret" && exit 1)
          scripts/db/restore_from_manifest.sh "$TARGET_DB_URL" "$MANIFEST_PATH"

      - name: Run DB smoke checks on restored target
        env:
          RESTORE_DEV_DB_URL: ${{ secrets.SUPABASE_RESTORE_DEV_DB_URL }}
          RESTORE_PROD_DB_URL: ${{ secrets.SUPABASE_RESTORE_PROD_DB_URL }}
        run: |
          set -euo pipefail
          if [[ "${BACKUP_ENV}" == "dev" ]]; then
            TARGET_DB_URL="${RESTORE_DEV_DB_URL:-}"
          else
            TARGET_DB_URL="${RESTORE_PROD_DB_URL:-}"
          fi
          test -n "$TARGET_DB_URL" || (echo "Missing restore target DB URL secret" && exit 1)
          psql "$TARGET_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/stage4_smoke.sql
