name: Backup Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Backup ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install backup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate backup secrets
        env:
          SUPABASE_DB_URL: ${{ matrix.environment == 'dev' && secrets.SUPABASE_DEV_DB_URL || secrets.SUPABASE_PROD_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_[DEV|PROD]_DB_URL" && exit 1)
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || (echo "Missing BACKUP_ENCRYPTION_PASSPHRASE" && exit 1)

      - name: Run encrypted backup
        env:
          SUPABASE_DB_URL: ${{ matrix.environment == 'dev' && secrets.SUPABASE_DEV_DB_URL || secrets.SUPABASE_PROD_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          scripts/db/backup_remote.sh "${{ matrix.environment }}" backups/remote

      - name: Resolve artifact metadata
        id: artifact-meta
        run: |
          set -euo pipefail
          manifest_path="$(find backups/remote -name manifest.json | head -n 1)"
          test -n "$manifest_path" || (echo "Backup manifest not found" && exit 1)

          backup_id="$(jq -r '.backup_id' "$manifest_path")"
          backup_class="$(jq -r '.backup_class' "$manifest_path")"
          backup_dir="$(dirname "$manifest_path")"

          case "$backup_class" in
            daily) retention_days=7 ;;
            weekly) retention_days=28 ;;
            monthly) retention_days=90 ;;
            *) retention_days=14 ;;
          esac

          echo "artifact_name=db-backup-${{ matrix.environment }}-${backup_id}" >> "$GITHUB_OUTPUT"
          echo "backup_dir=${backup_dir}" >> "$GITHUB_OUTPUT"
          echo "retention_days=${retention_days}" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-meta.outputs.artifact_name }}
          path: ${{ steps.artifact-meta.outputs.backup_dir }}
          if-no-files-found: error
          retention-days: ${{ steps.artifact-meta.outputs.retention_days }}
