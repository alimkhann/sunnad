name: CD Manual

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - dev
          - prod
      deploy_functions:
        description: "Deploy edge functions (if present)"
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN secret" && exit 1)
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL secret" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF secret" && exit 1)

      - name: Push DB migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Verify function runtime secrets
        if: ${{ inputs.deploy_functions }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Preflight: send-nudge-push requires these runtime secret names.
          # Values are never read or stored here — only names are checked.
          required="SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY APNS_TEAM_ID APNS_KEY_ID APNS_PRIVATE_KEY APNS_BUNDLE_ID_DEV APNS_BUNDLE_ID_PROD"
          names="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF")"
          missing=""
          for name in $required; do
            echo "$names" | grep -qE "(^|[[:space:]])$name([[:space:]]|$)" || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing Supabase function secrets:$missing"
            echo "Set them with: supabase secrets set --project-ref $SUPABASE_PROJECT_REF <NAME>=<value>"
            exit 1
          fi
          echo "All required function secrets present."

      - name: Deploy edge functions
        if: ${{ inputs.deploy_functions }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          shopt -s nullglob
          functions=(supabase/functions/*)
          if [ ${#functions[@]} -eq 0 ]; then
            echo "No functions directory entries found."
            exit 0
          fi

          for dir in "${functions[@]}"; do
            if [ -f "$dir/index.ts" ]; then
              name="$(basename "$dir")"
              echo "Deploying function: $name"
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
            fi
          done
