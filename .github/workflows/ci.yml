name: CI

on:
  pull_request:
    branches: [main]

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Secret guardrail scan
        run: |
          set -euo pipefail
          patterns=(
            'sbp_[0-9a-f]{32,}'
            'phc_[A-Za-z0-9]{32,}'
            'ONESIGNAL_REST_API_KEY\\s*=\\s*[A-Za-z0-9]{16,}'
            'SUPABASE_SERVICE_ROLE_KEY\\s*=\\s*[A-Za-z0-9._-]{16,}'
          )

          for pattern in "${patterns[@]}"; do
            if rg --pcre2 -n "$pattern" --glob '!.git' --glob '!landing/package-lock.json' --glob '!**/*.md'; then
              echo "Secret-like pattern detected: $pattern"
              exit 1
            fi
          done

  supabase-db:
    name: Supabase DB checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start Supabase local stack
        run: supabase start

      - name: Replay migrations and seed
        run: supabase db reset

      - name: Run Stage 4 smoke checks
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/stage4_smoke.sql

      - name: Run Stage 9 quote-admin smoke checks
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/stage9_quote_admin_smoke.sql

      - name: Run Stage 10 landing waitlist smoke checks
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/stage10_landing_smoke.sql

      - name: Run advisor lint SQL checks
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/advisor_lints.sql

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop

  ios-tests:
    name: iOS unit tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          xcodebuild \
            -project sunnad-ios/sunnad-ios.xcodeproj \
            -scheme sunnad-ios \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -only-testing:sunnad-iosTests \
            test

  landing-build:
    name: Landing page build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: landing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder
