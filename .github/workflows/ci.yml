name: CI

on:
  pull_request:
    branches: [main]

jobs:
  supabase-db:
    name: Supabase DB checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start Supabase local stack
        run: supabase start

      - name: Replay migrations and seed
        run: supabase db reset

      - name: Run Stage 4 smoke checks
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/stage4_smoke.sql

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop

  ios-tests:
    name: iOS unit tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          xcodebuild \
            -project sunnad-ios/sunnad-ios.xcodeproj \
            -scheme sunnad-ios \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -skipPackagePluginValidation \
            test
