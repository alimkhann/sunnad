name: CI

on:
  pull_request:
    branches: [main]

jobs:
  supabase-db:
    name: Supabase DB checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start Supabase local stack
        run: supabase start

      - name: Replay migrations and seed
        run: supabase db reset

      - name: Run Stage 4 smoke checks
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/stage4_smoke.sql

      - name: Run Stage 9 quote-admin smoke checks
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/stage9_quote_admin_smoke.sql

      - name: Run Stage 10 landing waitlist smoke checks
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/stage10_landing_smoke.sql

      - name: Run advisor lint SQL checks
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/advisor_lints.sql

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop

  ios-tests:
    name: iOS unit tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          xcodebuild \
            -project sunnad-ios/sunnad-ios.xcodeproj \
            -scheme sunnad-ios \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -skipPackagePluginValidation \
            test

  landing-build:
    name: Landing page build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: landing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder
