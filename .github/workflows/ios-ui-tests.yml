name: iOS UI Tests

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

jobs:
  ui-tests:
    name: iOS UI tests
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ios-ui-tests') }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run UI tests
        run: |
          xcodebuild \
            -project sunnad-ios/sunnad-ios.xcodeproj \
            -scheme sunnad-ios \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -configuration Debug \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -only-testing:sunnad-iosUITests \
            test
